version: 2
updates:
  # Dependencias de Python (requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # TODAS las actualizaciones de pip en un único PR semanal
      python-deps:
        patterns: ["*"]
    labels: [dependencies]

  # Imagen base del Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  # Workflows de GitHub Actions (por si se añade CI más adelante)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
